<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#242e29"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/pwa/icon-180.png"><title>동네AI 로그인</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f6f5f1;color:#26362a;font-family:system-ui}main{width:min(360px,85vw)}h1{font-size:28px}label{font-size:13px}input,button{display:block;box-sizing:border-box;width:100%;padding:14px;border:1px solid #c6cdbd;border-radius:7px;font:inherit;margin-top:10px}button{background:#26362a;color:white;cursor:pointer}p{font-size:13px;color:#78816f;line-height:1.7}.error{color:#b23c2a}</style></head><body><main><h1>◈ 동네AI</h1><p>나만의 광고 스튜디오에 로그인하세요.</p><form method="post" action="/login"><label for="password">접속 비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><p class="error" role="alert">{{ERROR}}</p><button>스튜디오 열기</button></form></main></body></html>
