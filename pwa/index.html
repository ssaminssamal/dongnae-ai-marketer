<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;font-family:system-ui,sans-serif;color:#26362a}header{height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:#242e29;color:#f6f5f1;padding-top:env(safe-area-inset-top)}header b{font-size:16px}header b span{color:#f2a281;margin-right:8px}nav{display:flex;gap:8px;align-items:center}button{font:inherit;font-size:12px;padding:7px 12px;border:1px solid #768173;background:transparent;color:inherit;border-radius:6px;cursor:pointer}button[hidden]{display:none}iframe{display:block;width:100%;height:calc(100dvh - 52px);border:0;background:#f6f5f1}dialog{width:min(92vw,440px);border:0;border-radius:14px;padding:24px;color:#26362a;box-shadow:0 18px 70px #0003}dialog::backdrop{background:#15251a88}dialog p{font-size:14px;line-height:1.8}dialog button{background:#26362a;color:white;margin-top:12px}#offline{display:none;padding:12px;background:#fcdfc7;font-size:12px}body.offline #offline{display:block}body.offline iframe{height:calc(100dvh - 92px)}@media(display-mode:standalone){#install{display:none!important}}@media(max-width:500px){header{padding-left:14px;padding-right:14px}header b{font-size:14px}nav button{font-size:11px;padding:6px 8px}}</style>
</head><body><header><b><span>◈</span>동네AI</b><nav><button id="install" hidden>앱 설치</button><button id="help">설치 안내</button><form method="post" action="/logout"><button type="submit">잠금</button></form></nav></header>

<iframe src="/studio/" title="광고 편집 스튜디오" allow="autoplay; clipboard-write" id="studio"></iframe>
<dialog id="instructions"><h2>동네AI 설치</h2><p id="platform"></p><p>홈 화면 아이콘으로 다시 열 수 있습니다. 영상·음성 제작에는 서버 연결이 필요합니다.</p><button id="close">닫기</button></dialog>
<script src="/pwa/install.js" defer></script></body></html>
